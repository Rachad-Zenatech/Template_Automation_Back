name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            gcc \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Check Python Syntax
        run: |
          python -m py_compile server.py

      # Real errors fail the build: syntax errors and undefined names.
      - name: Ruff (errors)
        run: |
          ruff check . --select E9,F63,F7,F82

      - name: Verify App Startup Imports
        env:
          APP_ENV: development
          SESSION_SECRET: ci-dummy-session-secret-for-import-check-32chars
          JWT_SECRET: ci-dummy-jwt-secret-for-import-check-32chars
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_check
        run: |
          python -c "import server"

      # Style issues are reported but don't block yet (there's a backlog of them to clear first).
      - name: Ruff (style report)
        run: |
          ruff check . --ignore E501 --statistics || true

      - name: Run Pytest
        run: |
          if [ -d "tests" ]; then
            pytest tests/ || true
          fi

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Purge Agent and AI Tooling
        run: |
          # Agent/AI tooling lives in GitHub only: never keep it on the server.
          rm -rf .agents .cursor .claude .cursorrules AGENTS.md CLAUDE.md GEMINI.md .antigravityignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: backend-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
